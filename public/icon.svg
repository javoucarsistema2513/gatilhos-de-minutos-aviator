<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#0B0F19" />
      <stop offset="100%" stop-color="#05070B" />
    </linearGradient>
    <linearGradient id="planeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF385C" />
      <stop offset="50%" stop-color="#E11D48" />
      <stop offset="100%" stop-color="#BE123C" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E11D48" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#F43F5E" stop-opacity="0" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="106" fill="none" stroke="#E11D48" stroke-width="3" stroke-opacity="0.35" />

  <!-- Radar / Minute Dial Arc -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#334155" stroke-width="4" stroke-dasharray="8 8" opacity="0.4" />
  <circle cx="256" cy="256" r="140" fill="none" stroke="#E11D48" stroke-width="2" stroke-dasharray="4 6" opacity="0.3" />

  <!-- Radar sweep / Target glow -->
  <path d="M 256 256 L 390 122 A 190 190 0 0 0 256 66 Z" fill="url(#glowGrad)" opacity="0.6" />

  <!-- Minute Tick Marks around dial -->
  <g stroke="#94A3B8" stroke-width="3" opacity="0.5">
    <line x1="256" y1="76" x2="256" y2="92" />
    <line x1="256" y1="420" x2="256" y2="436" />
    <line x1="76" y1="256" x2="92" y2="256" />
    <line x1="420" y1="256" x2="436" y2="256" />
  </g>

  <!-- Flight Curve Arc (Aviator style parabolic climb) -->
  <path d="M 100 390 Q 230 380 340 210" fill="none" stroke="#E11D48" stroke-width="8" stroke-linecap="round" filter="url(#neonGlow)" />
  <path d="M 100 390 Q 230 380 340 210" fill="none" stroke="#FECDD3" stroke-width="3" stroke-linecap="round" />

  <!-- Supersonic Aviator Prop Airplane -->
  <g transform="translate(340, 205) rotate(-38)">
    <!-- Motion trails -->
    <path d="M -90 -4 L -30 -1" stroke="#F43F5E" stroke-width="3" opacity="0.7" stroke-dasharray="6 4" />
    <path d="M -90 4 L -30 1" stroke="#F43F5E" stroke-width="3" opacity="0.7" stroke-dasharray="6 4" />
    
    <!-- Airplane Body -->
    <!-- Fuselage -->
    <path d="M -40 0 C -40 -12 25 -10 65 0 C 25 10 -40 12 -40 0 Z" fill="url(#planeGrad)" />
    <!-- Cabin Window -->
    <path d="M 5 -4 C 18 -4 32 -2 36 0 C 32 2 18 4 5 4 Z" fill="#38BDF8" opacity="0.9" />
    <!-- Wings -->
    <path d="M -5 -38 L 18 -6 L -10 -4 Z" fill="#BE123C" />
    <path d="M -5 38 L 18 6 L -10 4 Z" fill="#9F1239" />
    <!-- Tail Fin -->
    <path d="M -38 -20 L -25 -2 L -38 0 Z" fill="#881337" />
    <!-- Propeller nose glow -->
    <circle cx="68" cy="0" r="4" fill="#FBBF24" />
  </g>

  <!-- Multiplier Trigger Badge -->
  <g transform="translate(256, 420)">
    <rect x="-85" y="-22" width="170" height="44" rx="22" fill="#0F172A" stroke="#E11D48" stroke-width="2.5" />
    <text x="0" y="6" fill="#F43F5E" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="20" text-anchor="middle" letter-spacing="1">GATILHOS</text>
  </g>
</svg>
