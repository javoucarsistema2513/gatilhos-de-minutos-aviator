<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#1e1035"/>
      <stop offset="60%" stop-color="#0d0817"/>
      <stop offset="100%" stop-color="#06030a"/>
    </radialGradient>

    <!-- Radar Sweep Gradient -->
    <linearGradient id="radarSweep" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e11d48" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#c026d3" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#9333ea" stop-opacity="0.0"/>
    </linearGradient>

    <!-- Airplane Crimson Gradient -->
    <linearGradient id="planeBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff2e63"/>
      <stop offset="50%" stop-color="#e11d48"/>
      <stop offset="100%" stop-color="#9f1239"/>
    </linearGradient>

    <linearGradient id="wingGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fda4af"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>

    <filter id="glowEffect" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Cockpit Radar Base -->
  <rect width="512" height="512" rx="112" fill="url(#bgGlow)"/>

  <!-- Radar Concentric Circles -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="#e11d48" stroke-width="2" stroke-opacity="0.15" stroke-dasharray="6,6"/>
  <circle cx="256" cy="256" r="160" fill="none" stroke="#c026d3" stroke-width="2.5" stroke-opacity="0.25"/>
  <circle cx="256" cy="256" r="105" fill="none" stroke="#ec4899" stroke-width="2" stroke-opacity="0.2"/>
  <circle cx="256" cy="256" r="50" fill="none" stroke="#f43f5e" stroke-width="2" stroke-opacity="0.3"/>

  <!-- Radar Crosshairs -->
  <line x1="46" y1="256" x2="466" y2="256" stroke="#c026d3" stroke-width="1.5" stroke-opacity="0.2"/>
  <line x1="256" y1="46" x2="256" y2="466" stroke="#c026d3" stroke-width="1.5" stroke-opacity="0.2"/>

  <!-- Radar Sweep Arc Segment -->
  <path d="M256,256 L430,130 A210,210 0 0,0 256,46 Z" fill="url(#radarSweep)"/>

  <!-- Flight Trajectory / Jet Smoke Trail (Aviator curve) -->
  <path d="M 100,410 Q 180,390 230,310 T 320,200" fill="none" stroke="#e11d48" stroke-width="6" stroke-linecap="round" stroke-opacity="0.8" filter="url(#glowEffect)"/>
  <path d="M 120,420 Q 190,400 240,320" fill="none" stroke="#ec4899" stroke-width="3" stroke-linecap="round" stroke-opacity="0.5"/>

  <!-- Target Candle Pulsing Rings (Rosa / Roxa points) -->
  <circle cx="360" cy="140" r="12" fill="#c026d3" fill-opacity="0.5" filter="url(#glowEffect)"/>
  <circle cx="360" cy="140" r="6" fill="#f43f5e"/>
  <circle cx="160" cy="180" r="8" fill="#9333ea" fill-opacity="0.6"/>
  <circle cx="160" cy="180" r="4" fill="#d946ef"/>

  <!-- THE ICONIC AVIATOR AIRPLANE -->
  <g transform="translate(256, 220) rotate(-28) scale(1.15)" filter="url(#glowEffect)">
    <!-- Shadow / Underbelly -->
    <path d="M -15,10 L 0,-65 L 15,10 L 6,18 L -6,18 Z" fill="#7f1d1d" opacity="0.6"/>
    
    <!-- Left Wing (Perspective) -->
    <path d="M -8,-5 L -95,22 L -88,34 L -6,12 Z" fill="url(#wingGlow)"/>
    <!-- Left Wing Tip Light -->
    <circle cx="-92" cy="28" r="3.5" fill="#38bdf8"/>

    <!-- Right Wing -->
    <path d="M 8,-5 L 95,22 L 88,34 L 6,12 Z" fill="url(#planeBody)"/>
    <!-- Right Wing Tip Light -->
    <circle cx="92" cy="28" r="3.5" fill="#22c55e"/>

    <!-- Tail Wings -->
    <path d="M -4,42 L -38,55 L -34,62 L -3,52 Z" fill="#be123c"/>
    <path d="M 4,42 L 38,55 L 34,62 L 3,52 Z" fill="#be123c"/>
    <!-- Vertical Stabilizer (Fin) -->
    <path d="M 0,26 L -3,60 L 3,60 Z" fill="#f43f5e"/>

    <!-- Fuselage Body -->
    <path d="M 0,-72 C 10,-45 12,25 6,56 L -6,56 C -12,25 -10,-45 0,-72 Z" fill="url(#planeBody)"/>

    <!-- Cockpit Glass Window (Cyan glow) -->
    <path d="M 0,-48 C 4,-48 6,-32 4,-24 C 2,-20 -2,-20 -4,-24 C -6,-32 -4,-48 0,-48 Z" fill="#38bdf8" opacity="0.95"/>

    <!-- Propeller / Jet Nose Cone -->
    <ellipse cx="0" cy="-73" rx="4" ry="3" fill="#ffe4e6"/>
  </g>

  <!-- Glowing Radar Tag "82B RADAR" -->
  <rect x="180" y="435" width="152" height="32" rx="16" fill="#180e29" stroke="#e11d48" stroke-width="1.8"/>
  <text x="256" y="456" fill="#f43f5e" font-family="system-ui, sans-serif" font-weight="900" font-size="14" text-anchor="middle" letter-spacing="2">RADAR 82B</text>
</svg>
