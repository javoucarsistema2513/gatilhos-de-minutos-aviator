<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#15102a" />
      <stop offset="100%" stop-color="#240c2e" />
    </linearGradient>
    <linearGradient id="planeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="50%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="radarSweep" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="100" fill="url(#bgGrad)" />

  <!-- Radar circles -->
  <circle cx="256" cy="256" r="200" fill="none" stroke="#3730a3" stroke-width="2" stroke-opacity="0.4" stroke-dasharray="6,6" />
  <circle cx="256" cy="256" r="140" fill="none" stroke="#6366f1" stroke-width="2" stroke-opacity="0.4" />
  <circle cx="256" cy="256" r="80" fill="none" stroke="#ec4899" stroke-width="2" stroke-opacity="0.5" />
  <circle cx="256" cy="256" r="6" fill="#ec4899" filter="url(#neonGlow)" />

  <!-- Crosshairs -->
  <line x1="256" y1="56" x2="256" y2="456" stroke="#4f46e5" stroke-width="1.5" stroke-opacity="0.3" />
  <line x1="56" y1="256" x2="456" y2="256" stroke="#4f46e5" stroke-width="1.5" stroke-opacity="0.3" />

  <!-- Radar sweep pie sector -->
  <path d="M 256 256 L 396 116 A 198 198 0 0 1 454 256 Z" fill="url(#radarSweep)" opacity="0.35" />

  <!-- Flight trajectory vapor trail -->
  <path d="M 120 380 Q 200 320 280 230" fill="none" stroke="#f43f5e" stroke-width="4" stroke-linecap="round" opacity="0.7" stroke-dasharray="8,6" />
  <path d="M 140 395 Q 220 335 300 245" fill="none" stroke="#a855f7" stroke-width="3" stroke-linecap="round" opacity="0.5" />

  <!-- Aviator Jet Plane -->
  <g transform="translate(40, -10)" filter="url(#neonGlow)">
    <!-- Plane Body -->
    <path d="M 330 150 L 300 170 L 250 165 L 180 235 L 195 245 L 245 205 L 240 235 L 220 255 L 230 262 L 260 250 L 275 220 L 330 180 L 360 160 Z" fill="url(#planeGrad)" />
    <!-- Wing Highlight -->
    <polygon points="250,165 310,130 330,150 270,185" fill="#fbcfe8" opacity="0.8" />
  </g>

  <!-- Multiplier Badge -->
  <rect x="80" y="80" width="130" height="38" rx="19" fill="#1e1b4b" stroke="#ec4899" stroke-width="2" />
  <text x="145" y="105" fill="#f472b6" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="20" text-anchor="middle">10.00x+</text>

  <rect x="300" y="390" width="130" height="38" rx="19" fill="#1e1b4b" stroke="#a855f7" stroke-width="2" />
  <text x="365" y="415" fill="#c084fc" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="20" text-anchor="middle">ROXA 2x</text>
</svg>
