<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background gradient full bleed -->
    <linearGradient id="bgGradMask" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1124" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <!-- Red plane fuselage gradient -->
    <linearGradient id="redPlaneGradM" x1="0%" y1="0%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#ff4d4d" />
      <stop offset="35%" stop-color="#e11d48" />
      <stop offset="70%" stop-color="#be123c" />
      <stop offset="100%" stop-color="#881337" />
    </linearGradient>

    <!-- Wing highlight gradient -->
    <linearGradient id="redWingGradM" x1="0%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#ff6b6b" />
      <stop offset="50%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#991b1b" />
    </linearGradient>

    <!-- Underwing shadow gradient -->
    <linearGradient id="redShadowGradM" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9f1239" />
      <stop offset="100%" stop-color="#4c0519" />
    </linearGradient>

    <!-- Cockpit glass gradient -->
    <linearGradient id="cockpitGradM" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0f2fe" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <filter id="glowM" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Full-bleed background for maskable safe-zone -->
  <rect width="512" height="512" fill="url(#bgGradMask)" />

  <!-- Safe zone scaled contents (0.75 scale around center 256, 256) -->
  <g transform="translate(64, 64) scale(0.75)">
    <!-- Radar rings -->
    <circle cx="256" cy="256" r="180" fill="none" stroke="#e11d48" stroke-width="2" stroke-dasharray="6 8" stroke-opacity="0.3" />
    <circle cx="256" cy="256" r="110" fill="none" stroke="#e11d48" stroke-width="2" stroke-dasharray="4 6" stroke-opacity="0.25" />

    <!-- Vapor trail -->
    <path d="M 90 410 Q 150 390, 195 335 T 260 255" fill="none" stroke="#f43f5e" stroke-width="8" stroke-linecap="round" opacity="0.6" />
    <path d="M 70 435 Q 140 420, 185 365 T 240 280" fill="none" stroke="#fb7185" stroke-width="4" stroke-linecap="round" opacity="0.4" />

    <!-- Red airplane group -->
    <g transform="translate(10, -5)">
      <!-- Far wing -->
      <polygon points="260,225 350,145 375,152 305,255" fill="url(#redShadowGradM)" />

      <!-- Fuselage -->
      <path d="M 390 120 
               C 415 145, 405 170, 360 215 
               L 245 330 
               C 215 360, 180 375, 170 365 
               C 160 355, 175 320, 205 290 
               L 320 175 
               C 365 130, 375 110, 390 120 Z" 
            fill="url(#redPlaneGradM)" 
            filter="url(#glowM)" />

      <!-- Near wing -->
      <polygon points="295,245 190,320 180,300 240,200" fill="url(#redWingGradM)" />
      <polygon points="295,245 282,238 238,202 240,200" fill="#fca5a5" opacity="0.8" />

      <!-- Tail fin -->
      <polygon points="195,335 155,365 140,345 185,310" fill="url(#redWingGradM)" />
      <polygon points="195,335 188,328 143,344 140,345" fill="#fca5a5" opacity="0.6" />

      <!-- Horizontal Stabilizer -->
      <polygon points="175,348 145,360 148,370 185,360" fill="url(#redShadowGradM)" />

      <!-- Cockpit -->
      <path d="M 365 145 
               C 375 155, 370 170, 350 190 
               C 335 205, 325 210, 320 205 
               C 318 198, 330 180, 345 165 
               C 355 152, 360 143, 365 145 Z" 
            fill="url(#cockpitGradM)" />
      <ellipse cx="348" cy="172" rx="14" ry="5" transform="rotate(-45 348 172)" fill="#ffffff" opacity="0.75" />

      <!-- Highlights -->
      <path d="M 380 135 Q 310 205, 230 285" fill="none" stroke="#fee2e2" stroke-width="2.5" stroke-linecap="round" opacity="0.85" />
      <path d="M 388 128 Q 380 140, 360 160" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" opacity="0.9" />
    </g>
  </g>
</svg>
